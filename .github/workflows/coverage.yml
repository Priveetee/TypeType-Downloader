name: Coverage

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install libavformat headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libavformat-dev libavcodec-dev libavutil-dev

      - name: Run coverage
        run: go test ./... -coverprofile=coverage.out

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-profile
          path: coverage.out
