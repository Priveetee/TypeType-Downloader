name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install libavformat headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libavformat-dev libavcodec-dev libavutil-dev

      - name: Download modules
        run: go mod download

      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Validate scripts
        run: |
          bash -n scripts/e2e-beta.sh
          bash -n scripts/bench-beta.sh

      - name: Validate Compose config
        env:
          DB_PASSWORD: change-me
          S3_ACCESS_KEY: change-me
          S3_SECRET_KEY: change-me
        run: docker compose config --quiet

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Wolfi image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.wolfi
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
